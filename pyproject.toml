[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microagent"
version = "0.0.1"
description = "The micrograd of AI agents — a tiny, dependency-free, from-scratch agent framework for understanding how agents really work."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Kumar" }]
keywords = ["ai", "agents", "llm", "agent-framework", "education", "from-scratch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # zero runtime dependencies — that is the whole point.

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/rahul1368/microagent"
Source = "https://github.com/rahul1368/microagent"

[tool.hatch.build.targets.wheel]
packages = ["src/microagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
